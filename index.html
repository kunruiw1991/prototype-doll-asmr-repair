<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ASMR Prototype &amp; CatNap Studio</title>
  <meta name="description" content="Streamlined tactile ASMR Doll Restoration Studio recreating Poppy Playtime 4 Prototype 1006 &amp; CatNap." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="studio" id="studio">
    <!-- Minimalist icon-only floating top pill toolbar (inspired by critters-coloring-game) -->
    <header class="toolbar" id="toolbar" role="banner">
      <!-- Visual 24-step gallery drawer -->
      <button class="icon-btn" id="btn-chapters" aria-label="All 24 Scenes" title="Scenes (01/24)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.6"/>
          <rect x="14" y="3" width="7" height="7" rx="1.6"/>
          <rect x="3" y="14" width="7" height="7" rx="1.6"/>
          <rect x="14" y="14" width="7" height="7" rx="1.6"/>
        </svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <!-- Episode switcher (icon-only circular buttons) -->
      <div class="btn-group" role="tablist" aria-label="Episodes">
        <button class="icon-btn ep-btn active" id="btn-ep-prototype" role="tab" aria-selected="true" data-ep="prototype" aria-label="Episode 1: The Prototype 1006" title="EP.1 Prototype 1006">
          <span class="emoji-ico" aria-hidden="true">🃏</span>
        </button>
        <button class="icon-btn ep-btn" id="btn-ep-catnap" role="tab" aria-selected="false" data-ep="catnap" aria-label="Episode 2: CatNap Plush" title="EP.2 CatNap">
          <span class="emoji-ico" aria-hidden="true">🐱</span>
        </button>
      </div>

      <span class="sep" aria-hidden="true"></span>

      <!-- Step navigation + compact visual progress bar -->
      <div class="btn-group step-nav-group">
        <button class="icon-btn" id="btn-prev-step" aria-label="Previous Step" title="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>

        <div class="progress-capsule" id="progress-capsule" title="Step Progress">
          <span class="step-badge" id="step-counter">01/24</span>
          <div class="mini-track">
            <div class="mini-fill" id="step-progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <button class="icon-btn" id="btn-next-step" aria-label="Next Step" title="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>

        <button class="icon-btn assist-ico-btn" id="btn-auto-assist" aria-label="Guide / Auto Step" title="Guide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.5l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/>
            <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z" fill="currentColor" stroke="none"/>
          </svg>
        </button>
      </div>

      <span class="sep" aria-hidden="true"></span>

      <!-- Utility icon actions -->
      <div class="btn-group">
        <button class="icon-btn active-soft" id="btn-audio" aria-label="Toggle ASMR Sound" aria-pressed="true" title="ASMR Sound">
          <svg class="ico-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M19 5a9.5 9.5 0 0 1 0 14"/>
          </svg>
          <svg class="ico-sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="22" y1="9" x2="16" y2="15"/>
            <line x1="16" y1="9" x2="22" y2="15"/>
          </svg>
        </button>

        <button class="icon-btn active-soft" id="btn-spooky" aria-label="Toggle Spooky or Cozy Finale" aria-pressed="true" title="Spooky / Cozy Finale">
          <span class="emoji-ico" id="spooky-icon" aria-hidden="true">👻</span>
        </button>

        <!-- Inline visual-only reset confirmation (zero dialog popups!) -->
        <div class="clear-wrap" id="reset-wrap">
          <button class="icon-btn" id="btn-reset" aria-label="Restart Episode" title="Restart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
              <polyline points="3 3 3 8 8 8"/>
            </svg>
          </button>
          <div class="clear-confirm hidden" id="reset-confirm">
            <button class="icon-btn confirm-yes" id="btn-reset-yes" aria-label="Confirm Restart">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
            <button class="icon-btn confirm-no" id="btn-reset-no" aria-label="Cancel Restart">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Full-bleed central 16:9 interactive stage -->
    <section class="stage" id="stage">
      <div class="canvas-frame" id="canvas-frame">
        <canvas id="stage-canvas" width="1280" height="720" aria-label="ASMR Doll Restoration Interactive Stage"></canvas>

        <!-- Compact visual feedback badge (icon-led, auto-hides) -->
        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <!-- Compact floating finale action pill (zero giant text wall!) -->
        <div class="finale-pill hidden" id="overlay-finale" role="dialog" aria-label="Episode Complete">
          <button class="finale-action-btn primary" id="btn-finale-next" aria-label="Next Episode">
            <span class="emoji-ico" id="finale-next-emoji" aria-hidden="true">🐱</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
          <button class="finale-action-btn secondary" id="btn-finale-replay" aria-label="Replay Episode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
              <polyline points="3 3 3 8 8 8"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Streamlined floating bottom icon-only tool pill -->
    <footer class="tool-pill" id="tool-dock" role="toolbar" aria-label="Restoration Tools">
      <div class="tool-tray" id="tool-tray" role="group" aria-label="Tools"></div>
    </footer>

    <!-- Pure visual 24-scene thumbnail gallery overlay (inspired by critters-coloring-game) -->
    <div class="gallery-overlay hidden" id="chapter-drawer" role="dialog" aria-modal="true" aria-label="All 24 Scenes">
      <div class="gallery-backdrop" id="drawer-backdrop"></div>
      <div class="gallery-panel">
        <button class="icon-btn gallery-close" id="btn-close-drawer" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <div class="gallery-grid" id="drawer-list"></div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/state.js"></script>
  <script src="js/art_rooms.js"></script>
  <script src="js/art_prototype.js"></script>
  <script src="js/art_catnap.js"></script>
  <script src="js/art_tools.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
